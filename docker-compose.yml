services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trainer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trainer}
      POSTGRES_DB: ${POSTGRES_DB:-trainer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Security: БД доступна только с localhost хоста (для локальной разработки),
    # наружу порт не публикуем.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trainer} -d ${POSTGRES_DB:-trainer}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.26-alpine}
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    environment:
      APP_ENV: prod
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-trainer}:${POSTGRES_PASSWORD:-trainer}@postgres:5432/${POSTGRES_DB:-trainer}?sslmode=disable
      # Security: прокси внутри docker-сетей, которым доверяем X-Real-IP
      # для rate limiting (frontend-nginx ходит из 172.16.0.0/12).
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12,127.0.0.1,::1}
      TASKS_DIR: /app/tasks
      QUESTIONS_DIR: /app/questions
      RUNTIME_DIR: /app/runtime
      RUN_TIMEOUT: 30s
      # Генерация задач: LLM (OpenAI-совместимый) + PR на GitHub.
      # Фолбэки как в прошлом проекте: LLM_API_KEY || DEEPSEEK_API_KEY || OPENAI_API_KEY.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com/v1}
      # Пусто = роутер сам выбирает модель (не слать поле model).
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      LLM_MOCK: ${LLM_MOCK:-false}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-pozib-hub/interview-trainer-v2}
      GITHUB_API_BASE: ${GITHUB_API_BASE:-https://api.github.com}
      PROPOSAL_BASE_BRANCH: ${PROPOSAL_BASE_BRANCH:-main}
      PROPOSAL_DRY_RUN: ${PROPOSAL_DRY_RUN:-false}
      # Security: Secure-флаг cookie сессии. Включите (true) при работе за HTTPS,
      # иначе браузер не пришлёт cookie по http.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    # Security: ресурсные лимиты контейнера — в нём исполняется пользовательский
    # код (раннер): ограничения памяти/CPU/PID не дают одной петле или fork-бомбе
    # уронить хост. При выходе за лимиты контейнер будет перезапущен.
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
